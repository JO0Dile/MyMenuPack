<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyPlan</title>
  <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
  <!--
    This file contains NO university, major, course, or prerequisite data.
    Every item rendered below is fetched from the API at runtime; adding a
    university is a database operation, never an edit to this page.
  -->
  <header>
    <button id="home" class="brand">StudyPlan</button>
    <nav id="crumb" aria-live="polite"></nav>
  </header>

  <main>
    <p id="status" class="status" hidden></p>
    <div id="list" class="cards"></div>
    <div id="plan" hidden>
      <div id="planHead"></div>
      <div id="grid"></div>
    </div>
  </main>

  <script type="module" src="src/js/app.js"></script>
</body>
</html>
