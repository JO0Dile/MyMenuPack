<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyPlan</title>
  <link rel="stylesheet" href="src/css/style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-any.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0a1428">
</head>
<body>
  <!--
    This file contains NO university, major, course, or prerequisite data.
    Every item rendered below is fetched from the API at runtime; adding a
    university is a database operation, never an edit to this page.
  -->
  <header>
    <button id="home" class="brand"><span id="brandText">StudyPlan</span></button>
    <nav id="crumb" aria-live="polite"></nav>
    <button id="lang" class="lang" aria-label="Change language">العربية</button>
  </header>

  <main>
    <p id="status" class="status" hidden></p>
    <div id="list" class="cards"></div>
    <div id="plan" hidden>
      <div id="planHead"></div>
      <div id="achievements"></div>
      <div id="grid"></div>
    </div>
  </main>

  <script src="src/js/config.js"></script>
  <script type="module" src="src/js/app.js"></script>
  <script>
    // Only activates when hosted (https, or localhost during dev); opened as
    // a plain file this does nothing and the page still works normally.
    if (('serviceWorker' in navigator) && (location.protocol === 'https:' || location.hostname === 'localhost')) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* hosting without sw.js is fine */ });
      });
    }
  </script>
</body>
</html>
