name: Deploy web/ to GitHub Pages

# Publishes the web/ folder as a static site — this workflow IS the app's
# hosting: it's what puts https://jo0dile.github.io/MyMenuPack/ online and
# updates it on every push to main. The app is fully self-contained (its
# catalogue ships in web/plans.json), so this is the only deployment there is.
#
# configure-pages' `enablement: true` below makes it create the Pages site
# itself on first run (its default is to error out instead, expecting a
# manual "Settings -> Pages -> Source -> GitHub Actions" click first) — so
# there's no manual repo-settings step needed before this works.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload web/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
