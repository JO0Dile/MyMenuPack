name: Publish catalogue

# web/plans.json is generated from data/ and committed alongside it, so the app
# can ship its whole catalogue as one static file with no server. That works
# when a human edits data/ and runs the build themselves — but Admin Mode
# commits to data/ through a Worker, and a Worker cannot run Python.
#
# Without this, an admin edit landed in data/, plans.json stayed at the old
# content, the app kept serving the old content, and the Checks workflow failed
# with "run build-catalogue.py and commit the result" — which nobody was there
# to read. The change looked saved and simply never appeared.
#
# So: whenever data/ changes on main, rebuild and commit the result. That is the
# step the admin flow was missing, and it is what makes "live in about a minute"
# actually true.

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'tools/build-catalogue.py'
      - '.github/workflows/publish-catalogue.yml'
  workflow_dispatch:

# Needed to push the rebuilt file back.
permissions:
  contents: write

# Two admin saves in quick succession would otherwise race and one would land on
# a stale checkout. Queue them instead of cancelling: every edit must be built.
concurrency:
  group: publish-catalogue
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild web/plans.json from data/
        run: python3 tools/build-catalogue.py

      - name: Commit it, if it changed
        run: |
          if git diff --quiet -- web/plans.json; then
            echo "plans.json already matches data/ — nothing to publish."
            exit 0
          fi
          # A bot identity, so these are obviously not hand-authored commits.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/plans.json
          # This commit touches only web/, which this workflow does not watch,
          # so it cannot retrigger itself. The Pages workflow does watch web/,
          # which is exactly what deploys the change.
          git commit -m "build: rebuild plans.json from data/

          Generated by the publish-catalogue workflow after a change to data/.
          The app reads this file directly, so it has to move with its source."
          git push
